<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:#1E1A17}
button,input{font-family:inherit}
:root{--spring:linear(0,0.06 2%,0.22 5%,0.52 10%,0.82 16%,1 22%,1.07 28%,1.08 33%,1.05 41%,1.015 52%,0.997 64%,1);--soft:linear(0,0.1 3%,0.38 9%,0.72 17%,0.94 26%,1.03 35%,1.04 42%,1.02 55%,1)}
@keyframes up{0%{scale:.55;opacity:0}55%{scale:1.05;opacity:1}78%{scale:.985}100%{scale:1;opacity:1}}
@keyframes rise{from{translate:0 16px;opacity:0}to{translate:0 0;opacity:1}}
@keyframes scan{0%{top:8%}50%{top:86%}100%{top:8%}}
@keyframes ping{0%{scale:.6;opacity:.8}100%{scale:1.6;opacity:0}}
@keyframes leave{0%{translate:0 0;opacity:1}30%{translate:-8px 0}100%{translate:110px 0;opacity:0}}
@keyframes drift{0%{translate:0 0}50%{translate:-20px -6px}100%{translate:0 0}}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#F4EEE4}
.scenes{position:absolute;top:-4%;left:-40%;height:108%;width:170%;animation:drift 24s ease-in-out infinite}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.scene.on{opacity:1}
.veil{position:absolute;inset:0;transition:background 1.3s}
.glass{background:rgba(255,253,249,.9);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border:1px solid rgba(255,253,249,.7)}
.up{animation:up 1.3s var(--soft) both}
.s0{animation-delay:.05s}.s1{animation-delay:.18s}.s2{animation-delay:.31s}.s3{animation-delay:.44s}.s4{animation-delay:.57s}
.pane{animation:rise .7s var(--soft) both}
.wig{transition:translate .5s var(--spring)}
.wig:active{scale:.97}
.gone{animation:leave .5s cubic-bezier(.5,0,.3,1) forwards}
.tabpill{position:absolute;top:6px;left:6px;height:52px;width:calc((100% - 12px) / 3);border-radius:18px;background:#1E1A17;transition:transform .7s var(--spring)}
.cam{position:absolute;inset:0;z-index:30;background:#141210;opacity:0;pointer-events:none;transition:opacity .4s}
.cam.on{opacity:1;pointer-events:auto}
.frame{position:absolute;left:50%;top:44%;width:240px;height:240px;translate:-50% -50%;scale:.85;transition:scale .7s var(--spring)}
.cam.on .frame{scale:1}
.line{position:absolute;left:8%;right:8%;height:2px;background:#7FC8C2;box-shadow:0 0 14px #7FC8C2;animation:scan 2.2s ease-in-out infinite}
.found .line{display:none}
.found .frame{scale:.92}
.ping{position:absolute;inset:30%;border-radius:50%;border:2px solid #7FC8C2;animation:ping 1s ease-out infinite}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:35;background:#FFFDF9;border-radius:30px;box-shadow:0 -10px 50px rgba(30,26,23,.35);transform:translateY(calc(100% + 40px));transition:transform .8s var(--spring);max-height:84%;overflow:auto}
.sheet.on{transform:none}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:40;transform:translateY(160%);opacity:0;transition:transform .6s var(--spring),opacity .3s}
.toast.show{transform:none;opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>

<style>
html,body{height:100%}
body{margin:0;background:#1A1714!important;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5);transform-origin:center center;flex-shrink:0}
.back-link{position:fixed;top:14px;left:16px;color:#CDBFAB;font:600 13px Figtree,system-ui,sans-serif;text-decoration:none;z-index:9}
@media (max-width:500px){#frame{border-radius:0;box-shadow:none}.back-link{display:none}}
</style>
<script>function fit(){var f=document.getElementById('frame');if(!f)return;var s=Math.min(window.innerWidth/390,(window.innerHeight-(window.innerWidth<=500?0:32))/844);if(window.innerWidth>500)s=Math.min(1,s);f.style.transform='scale('+s+')';}window.addEventListener('resize',fit);document.addEventListener('DOMContentLoaded',fit);</script>
</head>
<body>

<script type="text/x-dc-template" id="dc-template">
<div class="phone">
  <div class="scenes" aria-hidden="true">
    <img class="{{ scLkNight }}" src="assets/lookout_night.jpg" alt="">
    <img class="{{ scLkMorning }}" src="assets/lookout_morning.jpg" alt="">
    <img class="{{ scLkDay }}" src="assets/lookout_day.jpg" alt="">
    <img class="{{ scLkSunset }}" src="assets/lookout_sunset.jpg" alt="">
    <img class="{{ scRvNight }}" src="assets/river_night.jpg" alt="">
    <img class="{{ scRvMorning }}" src="assets/river_morning.jpg" alt="">
    <img class="{{ scRvDay }}" src="assets/river_day.jpg" alt="">
    <img class="{{ scRvSunset }}" src="assets/river_sunset.jpg" alt="">
    <img class="{{ scVlNight }}" src="assets/valley_night.jpg" alt="">
    <img class="{{ scVlMorning }}" src="assets/valley_morning.jpg" alt="">
    <img class="{{ scVlDay }}" src="assets/valley_day.jpg" alt="">
    <img class="{{ scVlSunset }}" src="assets/valley_sunset.jpg" alt="">
  </div>
  <div class="veil" aria-hidden="true" style="background: {{ veilBg }}"></div>
  <div style="position: absolute; inset: 0; overflow-y: auto; padding-bottom: 110px; box-sizing: border-box">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px">
      <div class="glass up" style="display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border-radius: 999px">
        <img src="assets/seal.webp" alt="Cow Creek seal" style="width: 40px; height: 40px; object-fit: contain">
        <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Triplex</span><span style="font-size: 11px; color: #5E5249">Government Portal</span></span>
      </div>
      <div class="up s0" style="width: 44px; height: 44px; border-radius: 50%; background: #1F6F6B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">VS</div>
    </div>

    <sc-if value="{{ tToday }}" hint-placeholder-val="{{ true }}">
      <div class="pane" style="padding: 8px 16px; display: flex; flex-direction: column; gap: 14px">
        <div class="glass up s1" style="border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5E5249; font-variant-numeric: tabular-nums">{{ clockLabel }}</span>
          <span style="font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 1.1">Hello, Vivian</span>
          <label style="display: flex; align-items: center; gap: 10px; height: 50px; border-radius: 14px; border: 1px solid #D9CDBB; background: #FFFDF9; padding: 0 14px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span>
            <input placeholder="Member, Tribal ID, program…" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px">
          </label>
        </div>
        <div class="up s2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{ queues }}" as="q" hint-placeholder-count="4">
            <div class="glass" style="border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 92px">
              <span style="font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 1; color: {{ q.tint }}">{{ q.n }}</span>
              <span style="font-size: 13px; font-weight: 700; margin-top: auto">{{ q.label }}</span>
            </div>
          </sc-for>
        </div>
        <div class="glass up s3" style="border-radius: 24px; padding: 8px">
          <span style="display: block; padding: 10px 10px 6px; font-size: 15px; font-weight: 700">Next up</span>
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
            <div class="{{ it.cls }}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px">
              <span style="width: 38px; height: 38px; border-radius: 12px; background: {{ it.tint }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0">{{ it.ini }}</span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{ it.m }}</span><span style="font-size: 12px; color: #5E5249">{{ it.title }}</span></span>
              <button onClick="{{ it.ok }}" aria-label="Approve: {{ it.m }} {{ it.title }}" class="wig" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #1F6F6B; color: #FFFFFF; font-size: 18px; cursor: pointer; flex-shrink: 0">✓</button>
            </div>
          </sc-for>
          <sc-if value="{{ allDone }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 14px 10px; color: #5E5249">All caught up.</p></sc-if>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ tInspect }}" hint-placeholder-val="{{ false }}">
      <div class="pane" style="padding: 8px 16px; display: flex; flex-direction: column; gap: 14px">
        <div class="glass" style="border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8A5A12">Hunting &amp; Fishing</span>
          <span style="font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 1.1">License inspection</span>
          <span style="font-size: 14px; color: #5E5249">Scan the QR code on a member’s digital license to check their programs and tags in the field.</span>
          <button onClick="{{ startScan }}" class="wig" style="height: 58px; border-radius: 16px; border: 0; background: #8A5A12; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 12h8"></path></svg>Scan Hunter ID
          </button>
        </div>
        <div class="glass" style="border-radius: 24px; padding: 8px">
          <span style="display: block; padding: 10px 10px 6px; font-size: 15px; font-weight: 700">Checked today</span>
          <sc-for list="{{ checked }}" as="c" hint-placeholder-count="2">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 14px">
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{ c.name }}</span><span style="font-size: 12px; color: #5E5249">{{ c.when }}</span></span>
              <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #E3EFEE; color: #174F4C">Valid</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ tMembers }}" hint-placeholder-val="{{ false }}">
      <div class="pane" style="padding: 8px 16px; display: flex; flex-direction: column; gap: 10px">
        <span class="glass" style="align-self: flex-start; font-family: Fraunces, Georgia, serif; font-size: 28px; padding: 8px 16px; border-radius: 16px">Members</span>
        <sc-for list="{{ members }}" as="m" hint-placeholder-count="6">
          <div class="glass" style="border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 64px">
            <span style="width: 40px; height: 40px; border-radius: 50%; background: #7A1F2B; color: #F4EEE4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{ m.ini }}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{ m.name }}</span><span style="font-size: 12px; color: #5E5249">{{ m.tid }}</span></span>
            <span style="font-size: 16px; color: #7A1F2B" aria-hidden="true">›</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" class="glass up s4" style="position: absolute; left: 16px; right: 16px; bottom: 14px; height: 64px; border-radius: 24px; z-index: 10; display: flex; padding: 6px; box-sizing: border-box">
    <span class="tabpill" style="transform: translateX({{ tabX }}%)"></span>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button onClick="{{ t.pick }}" aria-current="{{ t.cur }}" style="position: relative; z-index: 1; flex: 1; height: 52px; border: 0; background: transparent; color: {{ t.fg }}; font-size: 13px; font-weight: 700; cursor: pointer; transition: color .35s; display: flex; align-items: center; justify-content: center; gap: 6px">{{ t.label }}<sc-if value="{{ t.n }}" hint-placeholder-val="{{ false }}"><span style="min-width: 18px; height: 18px; border-radius: 9px; background: #7A1F2B; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0 5px">{{ t.n }}</span></sc-if></button>
    </sc-for>
  </nav>

  <div class="{{ camCls }}" role="dialog" aria-label="Scanning Hunter ID">
    <div style="position: absolute; top: 18px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; color: #F4EEE4">
      <span style="font-size: 15px; font-weight: 700">{{ camMsg }}</span>
      <button onClick="{{ stopScan }}" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(244,238,228,.4); background: transparent; color: #F4EEE4; font-size: 18px; cursor: pointer">×</button>
    </div>
    <div class="frame" aria-hidden="true">
      <svg width="240" height="240" viewBox="0 0 240 240" fill="none" stroke="#F4EEE4" stroke-width="5" stroke-linecap="round"><path d="M8 52V18a10 10 0 0 1 10-10h34M188 8h34a10 10 0 0 1 10 10v34M232 188v34a10 10 0 0 1-10 10h-34M52 232H18a10 10 0 0 1-10-10v-34"></path></svg>
      <div style="position: absolute; inset: 56px; border-radius: 10px; background: repeating-conic-gradient(#3B3530 0 25%, #24201C 0 50%) 0 0 / 22px 22px; opacity: .85"></div>
      <div class="line"></div>
      <sc-if value="{{ found }}" hint-placeholder-val="{{ false }}"><div class="ping"></div></sc-if>
    </div>
    <span style="position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; color: #CDBFAB; font-size: 14px">Hold the code inside the frame</span>
  </div>

  <section class="{{ resCls }}" role="dialog" aria-label="Inspection result">
    <div style="display: flex; justify-content: center; padding-top: 10px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #D9CDBB"></span></div>
    <div style="padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 60px; height: 60px; border-radius: 50%; background: #7A1F2B; color: #F4EEE4; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 22px">BH</span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: Fraunces, Georgia, serif; font-size: 26px">Ben Harvey</span><span style="font-size: 13px; color: #5E5249">Tribal ID 00001081</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: #E3EFEE; color: #174F4C; font-size: 16px; font-weight: 700">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="2.4" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Valid license · enrolled in 2 programs
      </div>
      <sc-for list="{{ resProgs }}" as="r" hint-placeholder-count="2">
        <div style="display: flex; justify-content: space-between; gap: 12px; padding: 14px; border-radius: 16px; background: #F4EEE4">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{ r.name }}</span><span style="font-size: 13px; color: #5E5249">{{ r.sub }}</span></span>
          <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{ r.bg }}; color: {{ r.fg }}; align-self: center; white-space: nowrap">{{ r.state }}</span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 10px">
        <button onClick="{{ closeRes }}" style="flex: 1; height: 54px; border-radius: 16px; border: 1px solid #D9CDBB; background: #FFFDF9; font-size: 15px; font-weight: 700; cursor: pointer">Done</button>
        <button onClick="{{ again }}" class="wig" style="flex: 1; height: 54px; border-radius: 16px; border: 0; background: #8A5A12; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Scan another</button>
      </div>
    </div>
  </section>

  <div class="{{ toastCls }}" role="status" style="background: #1E1A17; color: #F4EEE4; padding: 14px 16px; border-radius: 16px; font-size: 14px; font-weight: 600">{{ toast }}</div>
</div>
</script>
<script>window.DC_LINKS = {"Combined.dc.html": "gov.html", "MemberDesktop.dc.html": "member.html", "MemberMobile.dc.html": "member-mobile.html", "GovMobile.dc.html": "gov-mobile.html", "Login.dc.html": "login.html", "Main.dc.html": "#", "Inbox.dc.html": "#", "Member.dc.html": "#", "Spaces.dc.html": "#", "Pipeline.dc.html": "#", "MemberApp.dc.html": "#"};</script>
<script src="js/react.production.min.js"></script>
<script src="js/react-dom.production.min.js"></script>
<script src="js/dc-lite.js"></script>
<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { scene: 'lk', sweep: 0, now: 0, tab: 'Today', gone: [], leaving: null, cam: false, found: false, res: false, checked: [{ name: 'Aaron Kuphal', when: '10:42 · Unit 3 trailhead' }], toast: '', showToast: false }; }
  componentDidMount(){ this._w = setTimeout(() => this.runSweep(), 1200); }
  componentWillUnmount(){ [this._a, this._b, this._t, this._w].forEach(clearTimeout); cancelAnimationFrame(this._sw); clearTimeout(this._rot); }
  say(m){ clearTimeout(this._t); this.setState({ toast: m, showToast: true }); this._t = setTimeout(() => this.setState({ showToast: false }), 2400); }
  nowMin(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  runSweep(){ cancelAnimationFrame(this._sw); const target = this.nowMin(); const t0 = performance.now(), dur = 4200;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      if (k < 1) { this.setState({ sweep: Math.round(target * e) }); this._sw = requestAnimationFrame(step); } else { this.setState({ sweep: null, now: target }); this.startRot(15000); } };
    this._sw = requestAnimationFrame(step); }
  sceneClasses(ph){ const cur = this.state.scene || 'lk'; const out = {};
    ['lk', 'rv', 'vl'].forEach(sc => ['night', 'morning', 'day', 'sunset'].forEach(p => { out['sc' + sc[0].toUpperCase() + sc.slice(1) + p[0].toUpperCase() + p.slice(1)] = 'scene' + (sc === cur && p === ph ? ' on' : ''); })); return out; }
  startRot(delay){ clearTimeout(this._rot); this._rotPaused = false; this._rotDue = Date.now() + delay;
    this._rot = setTimeout(() => { const order = ['lk', 'rv', 'vl']; const nx = order[(order.indexOf(this.state.scene || 'lk') + 1) % 3]; this.setState({ scene: nx }); this.startRot(15000); }, delay); }
  resumeOrStart(){ if (this._rotPaused) this.resumeRot(); else if (!this._rotDue) this.startRot(15000); }
  stopRot(){ clearTimeout(this._rot); this._rotPaused = false; this._rotDue = 0; }
  pauseRot(){ if (this._rotPaused || !this._rotDue) return; clearTimeout(this._rot); this._rotLeft = Math.max(800, this._rotDue - Date.now()); this._rotPaused = true; }
  resumeRot(){ if (!this._rotPaused) return; this.startRot(this._rotLeft); }
  renderVals() {
    const s = this.state;
    const seed = [{ id: 1, m: 'Travis King', title: 'Uploaded a DD-214', tint: '#7A1F2B' }, { id: 2, m: 'Ellen Koch', title: 'Changed mailing address', tint: '#7A1F2B' }, { id: 7, m: 'Ben Harvey', title: 'Reported an elk harvest', tint: '#8A5A12' }];
    const live = seed.filter(i => !s.gone.includes(i.id));
    const tabsL = ['Today', 'Inspect', 'Members'];
    const showMin = s.sweep !== null && s.sweep !== undefined ? s.sweep : (s.now || this.nowMin());
    const ph = showMin < 480 || showMin >= 1200 ? 'night' : showMin < 630 ? 'morning' : showMin < 1020 ? 'day' : 'sunset';
    const fmtT = (m) => { const h = Math.floor(m / 60), mm = m % 60; return ((h % 12) || 12) + ':' + String(mm).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
    const tod = { ...this.sceneClasses(ph),
      veilBg: ph === 'night' ? 'rgba(18,22,44,.22)' : 'rgba(244,238,228,.25)', loadFg: ph === 'night' ? '#F4EEE4' : '#1E1A17', loadShadow: ph === 'night' ? '0 1px 12px rgba(0,0,0,.6)' : '0 1px 12px rgba(255,236,220,.95)',
      clockLabel: new Date().toLocaleDateString('en-US', { weekday: 'long' }) + ' · ' + fmtT(showMin) };
    return { ...tod,
      tToday: s.tab === 'Today', tInspect: s.tab === 'Inspect', tMembers: s.tab === 'Members',
