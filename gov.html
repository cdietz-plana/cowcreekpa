<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Government Portal · Cow Creek</title>
<link rel="icon" href="assets/seal.webp">
<script>try{if(localStorage.getItem('cc-gate')!=='1952045729')location.replace('index.html')}catch(e){location.replace('index.html')}</script>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEE4;font-family:Figtree,system-ui,sans-serif;color:#1E1A17;overflow-x:hidden}
a{color:#7A1F2B}a:hover{color:#5A1520}
button,input,textarea{font-family:inherit}
:root{--spring:linear(0,0.06 2%,0.22 5%,0.52 10%,0.82 16%,1 22%,1.07 28%,1.08 33%,1.05 41%,1.015 52%,0.997 64%,1);--soft:linear(0,0.1 3%,0.38 9%,0.72 17%,0.94 26%,1.03 35%,1.04 42%,1.02 55%,1)}
.root{position:relative;min-height:900px}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.scenes{position:absolute;inset:-5%;width:110%;height:110%;transition:transform 1s var(--soft);animation:sceneIn 1.8s var(--soft) both}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.scene.on{opacity:1}
.timeline{position:fixed;left:50%;bottom:16px;z-index:30;width:min(760px,calc(100% - 32px));translate:-50% 160%;opacity:0;pointer-events:none;transition:translate 1.1s var(--spring),opacity .5s;border-radius:22px;padding:10px 16px 12px;box-sizing:border-box;display:flex;align-items:center;gap:16px}
.timeline.on{translate:-50% 0;opacity:1;pointer-events:auto}
.tltrack{position:relative;flex:1;height:44px;cursor:grab;touch-action:none;user-select:none}
.tltrack.drag{cursor:grabbing}
.seg{position:absolute;top:8px;height:10px}
.knob{position:absolute;top:1px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:3px solid #FFFDF9;box-shadow:0 4px 14px rgba(30,26,23,.35);padding:0;cursor:grab;transition:left .9s var(--spring),scale .4s var(--spring),background .6s}
.tltrack.drag .knob{transition:scale .4s var(--spring),background .6s;scale:1.25}
.tick{position:absolute;top:26px;font-size:11px;font-weight:700;color:#5E5249;translate:-50% 0;white-space:nowrap}
.veil{position:absolute;inset:0;opacity:0;transition:opacity 2s ease,background 1.3s ease}
.veil.on{opacity:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sceneIn{from{scale:1.16;opacity:0}to{scale:1;opacity:1}}
@keyframes up{0%{scale:.55;opacity:0}55%{scale:1.05;opacity:1}78%{scale:.985}100%{scale:1;opacity:1}}
@keyframes viewIn{from{opacity:0;scale:.97;translate:0 14px}to{opacity:1;scale:1;translate:0 0}}
@keyframes breathe{50%{scale:1.05}}
@keyframes pop{from{scale:.4;opacity:0}to{scale:1;opacity:1}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes wiggle{0%{rotate:0deg}22%{rotate:-1.6deg}46%{rotate:1.2deg}68%{rotate:-.6deg}86%{rotate:.25deg}100%{rotate:0deg}}
@keyframes leave{0%{translate:0 0;opacity:1}30%{translate:-10px 0}100%{translate:120px 0;opacity:0}}
@keyframes rise{from{translate:0 14px;opacity:0}to{translate:0 0;opacity:1}}
@keyframes inR{from{translate:60px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes inL{from{translate:-60px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes arrive{0%{opacity:0;translate:-40px 0;scale:.96}60%{opacity:1;translate:4px 0;scale:1.01}100%{translate:0 0;scale:1}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(31,111,107,.45)}100%{box-shadow:0 0 0 14px rgba(31,111,107,0)}}
.up{animation:up 1.5s var(--soft) both}
.s0{animation-delay:.5s}.s1{animation-delay:.68s}.s2{animation-delay:.86s}.s3{animation-delay:1.04s}.s4{animation-delay:1.22s}.s5{animation-delay:1.4s}.s6{animation-delay:1.58s}.s7{animation-delay:1.76s}
.seal.wait{opacity:0}
.page.pre .up{animation:none;opacity:0}
.page.pre .view{animation:none}
.flyseal{position:fixed;z-index:61;left:50%;top:41%;width:230px;height:230px;transform:translate(-50%,-50%);transition:left 1.8s var(--soft),top 1.8s var(--soft),width 1.8s var(--soft),height 1.8s var(--soft),transform 1.8s var(--soft)}
.flyseal.fly{left:34px;top:24px;width:48px;height:48px;transform:translate(0,0)}
.flyseal img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(30,26,23,.35));animation:pop 1.4s var(--soft) both,breathe 3.2s 1.4s ease-in-out infinite}
.flyseal.fly img{animation:none;filter:none}
.loadbox{position:fixed;z-index:60;left:0;right:0;top:calc(41% + 140px);display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .6s,translate .8s;animation:fade 1s .5s both}
.loadbox.out{opacity:0;translate:0 10px}
.loadtxt{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1E1A17;text-shadow:0 1px 12px rgba(255,236,220,.95)}
.track{width:160px;height:4px;border-radius:2px;background:rgba(255,253,249,.55);overflow:hidden}
.track span{display:block;height:100%;background:#7A1F2B;border-radius:2px;animation:fill 2.8s .2s cubic-bezier(.4,0,.2,1) both}
.page{position:relative;z-index:1;transform-origin:50% 0;transition:transform .7s var(--spring),filter .5s,border-radius .5s}
.page.back{transform:scale(.94) translateY(18px);filter:brightness(.82) saturate(.9);border-radius:28px}
.glass{background:rgba(255,253,249,.9);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border:1px solid rgba(255,253,249,.7)}
.view{animation:viewIn .9s var(--soft) both}
.wig{transition:translate .5s var(--spring),box-shadow .3s}
.wig:hover,.wig:focus-visible{translate:0 -5px;box-shadow:0 18px 40px rgba(30,26,23,.16);animation:wiggle .7s ease-out;outline:none}
.ghost{opacity:0!important;transition:none!important}
.search:focus-within{box-shadow:0 0 0 4px rgba(31,111,107,.25),0 18px 40px rgba(30,26,23,.12)}
.dim{transition:opacity .35s,filter .35s}
.dim.off{opacity:.25;filter:blur(2px);pointer-events:none}
.res{animation:rise .5s var(--spring) both}
.row{transition:background .2s}
.row:hover{background:rgba(244,238,228,.9)}
.gone{animation:leave .55s cubic-bezier(.5,0,.3,1) forwards}
.navpill{position:absolute;top:5px;left:5px;width:124px;height:40px;border-radius:999px;background:#1E1A17;transition:transform .7s var(--spring)}
.navbtn{position:relative;z-index:1;white-space:nowrap;width:124px;height:40px;border:0;background:transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;transition:color .35s}
.chip{transition:background .3s,color .3s,border-color .3s}
.zscrim{position:fixed;inset:0;z-index:40;background:rgba(30,26,23,.32);opacity:0;pointer-events:none;transition:opacity .45s}
.zscrim.on{opacity:1;pointer-events:auto}
.zoomer{position:fixed;z-index:41;overflow:hidden;background:#FFFDF9;box-shadow:0 30px 80px rgba(30,26,23,.28);transition:left .75s var(--spring),top .75s var(--spring),width .75s var(--spring),height .75s var(--spring),border-radius .6s}
.zin{opacity:0;transition:opacity .15s;height:100%;overflow:auto}
.zoomer.open .zin{opacity:1;transition:opacity .35s .3s}
.zcard{transition:opacity .2s}
.zoomer.open .zcard{opacity:0}
.dscrim{position:fixed;inset:0;z-index:50;background:rgba(30,26,23,.18);opacity:0;pointer-events:none;transition:opacity .5s}
.dscrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:24px;right:24px;top:44px;bottom:0;z-index:51;background:#F4EEE4;border-radius:28px 28px 0 0;box-shadow:0 -20px 70px rgba(30,26,23,.3);transform:translateY(110%);transition:transform .8s var(--spring);overflow:hidden;display:flex;flex-direction:column}
.drawer.on{transform:translateY(0)}
.drawer.on .dpart{animation:up 1.2s var(--soft) both}
.d1{animation-delay:.18s!important}.d2{animation-delay:.3s!important}.d3{animation-delay:.42s!important}
.tile{transition:translate .5s var(--spring),box-shadow .3s}
.tile:hover,.tile:focus-visible{translate:0 -5px;box-shadow:0 18px 36px rgba(30,26,23,.14);animation:wiggle .7s ease-out;outline:none}
.layer{position:absolute;z-index:3;overflow:hidden;background:#FFFDF9;border:1px solid #E3D9C9;box-shadow:0 24px 60px rgba(30,26,23,.18);transition:left .7s var(--spring),top .7s var(--spring),width .7s var(--spring),height .7s var(--spring),border-radius .6s}
.lin{opacity:0;transition:opacity .12s;height:100%;overflow:auto}
.layer.open .lin{opacity:1;transition:opacity .3s .28s}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--spring)}
.qitem.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.pane{animation:rise .6s var(--soft) both}
.menu{position:absolute;right:0;top:54px;width:280px;z-index:5;background:#FFFDF9;border-radius:18px;box-shadow:0 24px 60px rgba(30,26,23,.25);padding:8px;transform-origin:top right;scale:.85;opacity:0;pointer-events:none;transition:scale .5s var(--spring),opacity .25s}
.menu.on{scale:1;opacity:1;pointer-events:auto}
.mitem{width:100%;min-height:44px;border:0;background:transparent;border-radius:12px;text-align:left;padding:0 12px;font-size:14px;font-weight:600;color:#1E1A17;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.mitem:hover{background:#F4EEE4}
.sw{width:46px;height:28px;border-radius:14px;border:0;padding:3px;cursor:pointer;transition:background .3s;display:flex}
.sw span{width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:translate .5s var(--spring)}
.sw.on span{translate:18px 0}
.mscrim{position:fixed;inset:0;z-index:70;background:rgba(30,26,23,.38);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s}
.mscrim.on{opacity:1;pointer-events:auto}
.mbox{width:540px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;background:#FFFDF9;border-radius:26px;box-shadow:0 30px 80px rgba(30,26,23,.3);scale:.9;translate:0 24px;transition:scale .65s var(--spring),translate .65s var(--spring)}
.mscrim.on .mbox{scale:1;translate:0 0}
@keyframes inR2{from{translate:60px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes inL2{from{translate:-60px 0;opacity:0}to{translate:0 0;opacity:1}}
.stepF{animation:inR .6s var(--soft) both}.stepF2{animation:inR2 .6s var(--soft) both}
.stepB{animation:inL .6s var(--soft) both}.stepB2{animation:inL2 .6s var(--soft) both}
.c0{animation-delay:.03s}.c1{animation-delay:.08s}.c2{animation-delay:.13s}.c3{animation-delay:.18s}.c4{animation-delay:.23s}.c5{animation-delay:.28s}.c6{animation-delay:.33s}.c7{animation-delay:.38s}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font-size:13px;font-weight:600;color:#4E443C}
.fld input,.fld textarea{height:48px;border-radius:12px;border:1px solid #D9CDBB;background:#FFFFFF;padding:0 14px;font-size:16px;color:#1E1A17;outline:none;transition:box-shadow .2s,border-color .2s}
.fld textarea{height:120px;padding:12px 14px;resize:none}
.fld input:focus,.fld textarea:focus{border-color:#1F6F6B;box-shadow:0 0 0 4px rgba(31,111,107,.18)}
.dot{transition:width .5s var(--spring),background .3s}
.fly{position:fixed;top:12px;right:12px;bottom:12px;width:420px;max-width:calc(100% - 24px);z-index:66;background:#FFFDF9;border-radius:24px;box-shadow:0 24px 70px rgba(30,26,23,.3);transform:translateX(112%);transition:transform .75s var(--spring);overflow:auto}
.fly.on{transform:none}
.fscrim{position:fixed;inset:0;z-index:65;background:rgba(30,26,23,.25);opacity:0;pointer-events:none;transition:opacity .4s}
.fscrim.on{opacity:1;pointer-events:auto}
.pcard{transition:translate .5s var(--spring),box-shadow .3s}
.pcard:hover{translate:0 -3px;box-shadow:0 12px 26px rgba(30,26,23,.12)}
.pcard.moved{animation:arrive .7s var(--soft) both,glow 1s .3s ease-out}
.bar{transition:width .9s var(--soft)}
.toast{position:fixed;left:50%;bottom:100px;z-index:90;opacity:0;pointer-events:none;transform:translate(-50%,28px) scale(.96);transition:transform .6s var(--spring),opacity .3s}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.trow{animation:rise .5s var(--soft) both}
@media (max-width: 960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))!important}.g3{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width: 1100px){.hdr{display:flex!important;flex-wrap:wrap;justify-content:space-between}}
@media (max-width: 620px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)!important}.mainnav{order:3;width:100%;overflow-x:auto;scrollbar-width:none}h1{font-size:32px!important}.drawer{left:8px;right:8px;top:20px}.zoomer h2{font-size:34px!important}main{padding-left:12px!important;padding-right:12px!important}header{padding:12px!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>


</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="dc-template">
<div class="root landscape" onMouseMove="{{ move }}">
  <div class="bg" aria-hidden="true">
    <div class="scenes" ref="{{ r0 }}">
      <img class="{{ scLkNight }}" src="assets/lookout_night.jpg" alt="">
      <img class="{{ scLkMorning }}" src="assets/lookout_morning.jpg" alt="">
      <img class="{{ scLkDay }}" src="assets/lookout_day.jpg" alt="">
      <img class="{{ scLkSunset }}" src="assets/lookout_sunset.jpg" alt="">
      <img class="{{ scRvNight }}" src="assets/river_night.jpg" alt="">
      <img class="{{ scRvMorning }}" src="assets/river_morning.jpg" alt="">
      <img class="{{ scRvDay }}" src="assets/river_day.jpg" alt="">
      <img class="{{ scRvSunset }}" src="assets/river_sunset.jpg" alt="">
      <img class="{{ scVlNight }}" src="assets/valley_night.jpg" alt="">
      <img class="{{ scVlMorning }}" src="assets/valley_morning.jpg" alt="">
      <img class="{{ scVlDay }}" src="assets/valley_day.jpg" alt="">
      <img class="{{ scVlSunset }}" src="assets/valley_sunset.jpg" alt="">
    </div>
    <div class="{{ veilCls }}" style="background: {{ veilBg }}"></div>
  </div>
  <sc-if value="{{ introOn }}" hint-placeholder-val="{{ false }}">
    <div class="{{ flyCls }}" aria-hidden="true"><img src="assets/seal.webp" alt=""></div>
    <div class="{{ loadCls }}" role="status"><span class="loadtxt" style="color: {{ loadFg }}; text-shadow: {{ loadShadow }}">Loading…</span><div class="track"><span></span></div></div>
  </sc-if>

  <div class="{{ pageCls }}">
    <header class="hdr" style="position: relative; z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding: 18px 28px">
      <div class="glass up" style="justify-self: start; display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 6px; border-radius: 999px; min-width: 0">
        <img class="{{ sealCls }}" src="assets/seal.webp" alt="Cow Creek Band of Umpqua Tribe of Indians seal" style="width: 48px; height: 48px; object-fit: contain">
        <div style="display: flex; flex-direction: column">
          <span style="font-weight: 700; font-size: 16px">Triplex</span>
          <span style="font-size: 12px; color: #5E5249">Government Portal</span>
        </div>
      </div>
      <nav aria-label="Main" class="glass up s1 mainnav" style="position: relative; display: flex; padding: 5px; border-radius: 999px">
        <span class="navpill" style="transform: translateX({{ navX }}px); opacity: {{ navPillOp }}; transition: transform .7s var(--spring), opacity .3s"></span>
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
          <button onClick="{{ n.go }}" aria-current="{{ n.cur }}" class="navbtn" style="color: {{ n.fg }}">{{ n.label }}<sc-if value="{{ n.count }}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; border-radius: 10px; background: #7A1F2B; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 6px">{{ n.count }}</span></sc-if></button>
        </sc-for>
      </nav>
      <div class="up s2" style="justify-self: end; display: flex; align-items: center; gap: 10px">
        <button onClick="{{ openSettings }}" aria-label="Settings" class="wig" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,253,249,.7); background: {{ gearBg }}; color: {{ gearFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
        <button onClick="{{ replay }}" aria-label="Replay opening animation" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; opacity: 0; cursor: pointer"></button>
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #1F6F6B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600">VS</div>
      </div>
    </header>

    <main style="display: flex; justify-content: center; padding: 28px 24px 120px">
      <div style="width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 22px">

        <sc-if value="{{ vToday }}" hint-placeholder-val="{{ true }}">
          <div class="view" style="display: flex; flex-direction: column; gap: 22px">
            <section class="glass up s2" style="border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 3">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 13px; color: #5E5249; letter-spacing: .06em; text-transform: uppercase; font-weight: 600">{{ dayPart }}</span>
                <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 44px; line-height: 1.08">What are you working on, Vivian?</h1>
              </div>
              <label class="search" style="display: flex; align-items: center; gap: 14px; background: #FFFDF9; border: 1px solid #D9CDBB; border-radius: 18px; padding: 0 18px; height: 64px; transition: box-shadow .3s">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6F6B" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search members, programs or actions</span>
                <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search a member, Tribal ID, program, or an action…" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 18px; color: #1E1A17">
                <sc-if value="{{ searching }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ clear }}" aria-label="Clear search" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #F4EEE4; cursor: pointer; font-size: 16px; color: #5E5249">×</button>
                </sc-if>
              </label>
              <sc-if value="{{ searching }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <sc-for list="{{ results }}" as="r" hint-placeholder-count="4">
                    <button onClick="{{ r.open }}" class="row res {{ r.s }}" style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 0; background: transparent; border-radius: 12px; text-align: left; cursor: pointer; min-height: 56px">
                      <span style="width: 36px; height: 36px; border-radius: 10px; background: {{ r.tint }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{ r.badge }}</span>
                      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600; color: #1E1A17">{{ r.label }}</span><span style="font-size: 13px; color: #5E5249">{{ r.sub }}</span></span>
                      <span style="font-size: 12px; color: #5E5249; text-transform: uppercase; letter-spacing: .05em">{{ r.kind }}</span>
                    </button>
                  </sc-for>
                  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 12px; color: #5E5249">No match. Try a Tribal ID or a program name.</p></sc-if>
                </div>
              </sc-if>
              <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
